{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; line-height: 1.6; }
  a { color: #7c9bff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .container { max-width: 900px; margin: 0 auto; padding: 1rem; }
  header { background: #16213e; padding: 1rem 0; border-bottom: 1px solid #0f3460; margin-bottom: 1.5rem; }
  header .container { display: flex; align-items: center; gap: 1rem; }
  header h1 { font-size: 1.2rem; }
  header h1 a { color: #e0e0e0; }
  .breadcrumb { font-size: 0.85rem; color: #888; }
  .breadcrumb a { color: #7c9bff; }
  .channel-list { list-style: none; }
  .channel-list li { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; }
  .channel-list li a { font-size: 1.1rem; font-weight: 600; }
  .channel-desc { color: #888; font-size: 0.9rem; margin-top: 0.25rem; }
  .message { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; }
  .message.deleted { opacity: 0.5; }
  .message-meta { font-size: 0.8rem; color: #888; margin-bottom: 0.3rem; }
  .message-meta .author { color: #7c9bff; font-weight: 600; }
  .message-content { white-space: pre-wrap; word-break: break-word; }
  .message-footer { font-size: 0.75rem; color: #666; margin-top: 0.3rem; }
  .pagination { display: flex; gap: 0.5rem; justify-content: center; margin: 1.5rem 0; }
  .pagination a, .pagination span { padding: 0.3rem 0.7rem; border: 1px solid #0f3460; border-radius: 4px; }
  .pagination .current { background: #0f3460; }
  footer { text-align: center; font-size: 0.75rem; color: #555; padding: 2rem 0 1rem; }
</style>
{{end}}
