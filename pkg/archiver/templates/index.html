<!DOCTYPE html>
<html lang="en">
<head>
{{template "head"}}
<title>SuperChat Archive</title>
<meta name="description" content="Archive of SuperChat conversations">
</head>
<body>
<header>
  <div class="container">
    <h1><a href="/">SuperChat Archive</a></h1>
  </div>
</header>
<div class="container">
  <h2>Channels</h2>
  <ul class="channel-list">
  {{range .Channels}}
    <li>
      <a href="/channel/{{.Name}}/">#{{.Name}}</a>
      {{if .Description}}<div class="channel-desc">{{.Description}}</div>{{end}}
    </li>
  {{else}}
    <li>No archived channels yet.</li>
  {{end}}
  </ul>
</div>
<footer>
  <div class="container">Generated {{.GeneratedAt}} by SuperChat Archiver</div>
</footer>
</body>
</html>
